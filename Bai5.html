<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bài 5 — Form HTML</title>
    <style>
        body {
            font: 16px/1.6 Arial, sans-serif;
            background: #edf2f7;
            color: #1c2d45;
            padding: 24px;
        }

        .card {
            max-width: 760px;
            margin: auto;
            background: white;
            padding: 26px;
            border-radius: 12px;
        }

        fieldset, .field {
            margin: 16px 0;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 14px;
        }

        label {
            display: block;
            margin: 8px 0;
        }

        input[type="text"], select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
        }

        textarea {
            height: 90px;
        }

        button {
            padding: 10px 16px;
            margin-right: 8px;
            background: #118879;
            color: white;
            border: 0;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <main class="card">
        <a href="index.html">← Trang chủ</a>
        <h1>Bài 5: Khảo sát đầu tư</h1>

        <form action="#ket-qua" method="get">
            <fieldset>
                <legend>Kinh nghiệm đầu tư</legend>
                <label><input type="radio" name="experience" value="beginner" required> Người mới</label>
                <label><input type="radio" name="experience" value="intermediate"> Có kinh nghiệm</label>
                <label><input type="radio" name="experience" value="expert"> Chuyên gia</label>
            </fieldset>

            <fieldset>
                <legend>Loại hình đầu tư</legend>
                <label><input type="checkbox" name="investment" value="stocks"> Cổ phiếu cá nhân</label>
                <label><input type="checkbox" name="investment" value="options"> Quyền chọn</label>
                <label><input type="checkbox" name="investment" value="funds"> Quỹ tương hỗ</label>
            </fieldset>

            <p class="field">
                <label for="frequency">Bạn giao dịch cổ phiếu thường xuyên thế nào?</label>
                <select id="frequency" name="frequency">
                    <option>Hằng ngày</option>
                    <option>Hằng tuần</option>
                    <option>Hằng tháng</option>
                    <option>Hiếm khi</option>
                </select>
            </p>

            <p class="field">
                <label for="stock">Tên cổ phiếu quan tâm</label>
                <input id="stock" type="text" name="stock">
            </p>

            <p class="field">
                <label for="advice">Lời khuyên đầu tư</label>
                <textarea id="advice" name="advice"></textarea>
            </p>

            <button type="submit">Gửi khảo sát</button>
            <button type="reset">Nhập lại</button>
        </form>
    </main>
</body>
</html>
